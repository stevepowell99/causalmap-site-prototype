site_name: Causal Map
site_url: https://causalmap.app
app_url: https://app.causalmap.app
help_url: https://garden.causalmap.app
input_dir: content
output_dir: dist

# Navbar logo (white version for the dark navbar), and the meta description for pages without one.
logo_path: "/assets/logo-white.png"
default_description: "Causal mapping software for qualitative research and evaluation"

# UTM params appended to every link to app_url at build time (acquisition attribution).
# Set utm_source empty to disable. Links that already carry utm_source are left untouched.
app_utm:
  utm_source: causalmap-site
  utm_medium: referral
  utm_campaign: corporate-site

# Stamp app links with the host that referred the visitor here (as ref_host), since
# the app itself only ever sees causalmap.app as the referrer.
app_ref_host: true

colors:
  accent_primary: "#00ffaf"
  accent_secondary: "#6dc4c8"
  accent_ink: "#1f1f36"
  accent_pink: "#ff8fb8"
  highlight_yellow: "#f7ed73"
  body_bg: "#fcfcfc"
  text: "#222"

analytics:
  goatcounter: "https://causal-map.goatcounter.com/count"
  # Shared Umami website with garden.causalmap.app (same root domain; free tier
  # allows one site). Separate the two in Umami reports by filtering on Hostname.
  umami_id: "cc6d6b30-1bf8-497f-b38a-7feae109d761"
  umami_script: "https://cloud.umami.is/script.js"
