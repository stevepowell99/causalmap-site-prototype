[build]
  # Install Python deps, then generate the static site.
  command = "pip install -r requirements.txt && python build.py"
  # Netlify should serve the generated site only.
  publish = "dist"

# Security response headers applied to every page.
# CSP allows the site's own assets plus the external services it uses:
# Google Fonts, Font Awesome (cdnjs), Vimeo/YouTube embeds, and Umami (when enabled).
# Inline scripts/styles are generated by build.py, so 'unsafe-inline' is required;
# the site renders no user input as HTML, so XSS exposure is low.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cloud.umami.is https://gc.zgo.at; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; frame-src https://player.vimeo.com https://www.youtube-nocookie.com; connect-src 'self' https://cloud.umami.is https://gateway.umami.is https://causal-map.goatcounter.com; form-action 'self' https://docs.google.com; upgrade-insecure-requests"
